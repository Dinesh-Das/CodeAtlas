name: Stable Release Evidence

on:
  workflow_dispatch:
    inputs:
      repository:
        description: HTTPS URL of an independent public Git repository
        required: true
        type: string
      ref:
        description: Branch or tag to validate
        required: true
        default: main
        type: string
      audit_id:
        description: Unique stable-release evidence ID
        required: true
        type: string
      runner:
        description: Operating system to record
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.audit_id }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: ${{ inputs.repository }}
      TARGET_REF: ${{ inputs.ref }}
      AUDIT_ID: ${{ inputs.audit_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clone the independent repository
        shell: pwsh
        run: |
          node -e "const value=new URL(process.env.TARGET_REPOSITORY); if(value.protocol!=='https:'||value.username||value.password) throw new Error('repository must be credential-free HTTPS')"
          git init external-repository
          git -C external-repository remote add origin $env:TARGET_REPOSITORY
          git -C external-repository fetch --depth 1 origin $env:TARGET_REF
          git -C external-repository checkout --detach FETCH_HEAD
      - name: Validate the packed artifact
        shell: pwsh
        run: >-
          npm run validate:repository --
          --repository external-repository
          --id $env:AUDIT_ID
          --output release-validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-release-evidence-${{ inputs.audit_id }}-${{ inputs.runner }}
          path: release-validation.json
          if-no-files-found: error
          retention-days: 90
