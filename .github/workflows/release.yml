name: npm Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release tag
        run: >-
          node -e "const version=require('./package.json').version;
          if(process.env.GITHUB_REF_NAME !== 'v' + version) {
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match v' + version); }"
      - run: npm run release:check
      - run: npm publish
