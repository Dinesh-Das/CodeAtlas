name: npm Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Release validation (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.12, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:smoke

  supply-chain:
    name: Coverage, dependency audit, and release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - run: npm run release:gate

  codeql:
    name: Release CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4

  publish:
    name: Publish verified package
    needs: [validate, supply-chain, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release tag
        run: >-
          node -e "const version=require('./package.json').version;
          if(process.env.GITHUB_REF_NAME !== 'v' + version) {
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match v' + version); }"
      - run: npm run build
      - run: npm run release:gate
      - name: Protect npm release channels
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          latest="$(npm view @dinesh-das/codeatlas dist-tags.latest --json 2>/dev/null | tr -d '"' || true)"
          if [[ "$version" == *-* && "$latest" == *-* ]]; then
            echo "::error::npm latest points to prerelease $latest; remove that dist-tag before publishing another prerelease."
            exit 1
          fi
      - name: Publish with provenance and the correct npm dist-tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
            npm publish --provenance --tag "$dist_tag"
          else
            npm publish --provenance
          fi
      - name: Verify the immutable registry artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # npm's metadata and tarball endpoints are eventually consistent immediately
          # after a successful publish. Retry the exact version before failing the release.
          published=""
          for attempt in {1..12}; do
            published="$(npm view "@dinesh-das/codeatlas@$version" version 2>/dev/null || true)"
            if [[ "$published" == "$version" ]]; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::npm did not expose @dinesh-das/codeatlas@$version after 120 seconds (last response: $published)"
              exit 1
            fi
            echo "Registry metadata is not visible yet (attempt $attempt/12); retrying in 10 seconds"
            sleep 10
          done
          npm pack "@dinesh-das/codeatlas@$version" --silent --pack-destination "$RUNNER_TEMP"
          artifact="$RUNNER_TEMP/dinesh-das-codeatlas-$version.tgz"
          expected_sha="$(node -p "require('./release-evidence.json').releaseArtifact.packageSha256")"
          actual_sha="$(sha256sum "$artifact" | cut -d' ' -f1)"
          test "$actual_sha" = "$expected_sha"
      - name: Install and validate the MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_version="v1.7.9"
          publisher_archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/$publisher_version/mcp-publisher_linux_amd64.tar.gz" \
            --output "$publisher_archive"
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  $publisher_archive" \
            | sha256sum --check
          tar --extract --gzip --file "$publisher_archive" --directory "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate
      - name: Publish the verified MCP metadata with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
      - name: Verify the MCP Registry version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          response="$RUNNER_TEMP/mcp-registry-response.json"
          for attempt in {1..12}; do
            curl --fail --silent --show-error \
              "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.dinesh-das%2Fcodeatlas" \
              --output "$response"
            if MCP_REGISTRY_EXPECTED_VERSION="$version" MCP_REGISTRY_RESPONSE="$response" node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const response = JSON.parse(readFileSync(process.env.MCP_REGISTRY_RESPONSE, "utf8"));
              const found = (response.servers ?? []).some((entry) => {
                const server = entry.server ?? entry;
                return server.name === "io.github.dinesh-das/codeatlas" &&
                  server.version === process.env.MCP_REGISTRY_EXPECTED_VERSION;
              });
              if (!found) process.exit(1);
            '; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::MCP Registry did not expose the published CodeAtlas version."
              exit 1
            fi
            sleep 10
          done
