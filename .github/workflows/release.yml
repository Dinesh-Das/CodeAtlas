name: npm Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Release validation (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.12, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:smoke

  supply-chain:
    name: Coverage, dependency audit, and release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - run: npm run release:gate

  codeql:
    name: Release CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4

  publish:
    name: Publish verified package
    needs: [validate, supply-chain, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release tag
        run: >-
          node -e "const version=require('./package.json').version;
          if(process.env.GITHUB_REF_NAME !== 'v' + version) {
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match v' + version); }"
      - run: npm run build
      - run: npm run release:gate
      - name: Protect npm release channels
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          latest="$(npm view @dinesh-das/codeatlas dist-tags.latest --json 2>/dev/null | tr -d '"' || true)"
          if [[ "$version" == *-* && "$latest" == *-* ]]; then
            echo "::error::npm latest points to prerelease $latest; remove that dist-tag before publishing another prerelease."
            exit 1
          fi
      - name: Publish with provenance and the correct npm dist-tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
            npm publish --provenance --tag "$dist_tag"
          else
            npm publish --provenance
          fi
      - name: Verify the immutable registry artifact
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "@dinesh-das/codeatlas@$version" version)"
          test "$published" = "$version"
          npm pack "@dinesh-das/codeatlas@$version" --silent --pack-destination "$RUNNER_TEMP"
          artifact="$RUNNER_TEMP/dinesh-das-codeatlas-$version.tgz"
          expected_sha="$(node -p "require('./release-evidence.json').releaseArtifact.packageSha256")"
          actual_sha="$(sha256sum "$artifact" | cut -d' ' -f1)"
          test "$actual_sha" = "$expected_sha"
